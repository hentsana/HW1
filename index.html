<!DOCTYPE html>
<html>

<head lang="uk">
    <meta charset="UTF-8">
    <title>My Page</title>


    <link rel="stylesheet" type="text/css" href="main.css" />
</head>

<body>
    <div class="main">

        <div class="left">
            <form class="add-product">
                <input type="text" placeholder="Назва товару" class="input-product">
                <button class="add-button" data-tooltip="Add product">
                    Додати
                </button>
            </form>

            <div id="product-list">
                <span class="product-item">
                    <span class="product-name">Apple</span>
                <button class="minus-button" data-tooltip="Minus button">-</button>
                <span class="amount">4</span>
                <button class="plus-button" data-tooltip="Plus button">+</button>
                <button class="buy-button" data-tooltip="Buy button">Куплено</button>
                <button class="delete-button" data-tooltip="Delete button">×</button>
                </span>
                <span class="product-item">
                    <span class="product-name">Tomato</span>
                <button class="minus-button" data-tooltip="Minus button">-</button>
                <span class="amount">4</span>
                <button class="plus-button" data-tooltip="Plus button">+</button>
                <button class="buy-button" data-tooltip="Buy button">Куплено</button>
                <button class="delete-button" data-tooltip="Delete button">×</button>
                </span>
                <span class="product-item">
                    <span class="product-name">Cookie</span>
                <button class="minus-button" data-tooltip="Minus button">-</button>
                <span class="amount">4</span>
                <button class="plus-button" data-tooltip="Plus button">+</button>
                <button class="buy-button" data-tooltip="Buy button">Куплено</button>
                <button class="delete-button" data-tooltip="Delete button">×</button>
                </span>
            </div>
        </div>

        <div class="right">
            <div class="right-top" id="no-bought">
                <h2>Залишилося</h2>
                <span class="product-item-right">
                    Tomatoes
                    <span class="amount-right">4</span>
                </span>
                <span class="product-item-right">
                    Cookie
                    <span class="amount-right">4</span>
                </span>
                <span class="product-item-right">
                    Apple
                    <span class="amount-right">4</span>
                </span>
            </div>

            <div class="right-bottom" id="bought">
                <h2>Куплено</h2>
            </div>
        </div>

    </div>

    <div class=" badge">
        <span class="badge-buyList">Buy List</span>
        <span class=" badge-name">Topchyi Violetta</span>
    </div>
    <script src="jsCode.js"></script>
</body>

</html>
